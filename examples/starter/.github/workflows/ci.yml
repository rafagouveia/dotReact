name: DotReact application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run audit:dotnet

  azure-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: az bicep install
      - run: mkdir -p artifacts/bicep
      - run: az bicep build --file deploy/azure/app-service.bicep --outfile artifacts/bicep/app-service.json
      - run: az bicep build --file deploy/azure/container-apps.bicep --outfile artifacts/bicep/container-apps.json
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          scan-type: config
          scan-ref: artifacts/bicep
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  container:
    runs-on: ubuntu-latest
    needs: [quality, azure-infrastructure]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          push: false
          tags: dotreact-app:ci
          provenance: mode=max
          sbom: true
