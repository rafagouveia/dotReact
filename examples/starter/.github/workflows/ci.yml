name: DotReact application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: dotnet list Server/Server.csproj package --vulnerable --include-transitive

  azure-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: mkdir -p artifacts/bicep
      - run: az bicep build --file deploy/azure/app-service.bicep --outfile artifacts/bicep/app-service.json
      - run: az bicep build --file deploy/azure/container-apps.bicep --outfile artifacts/bicep/container-apps.json
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: artifacts/bicep
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  container:
    runs-on: ubuntu-latest
    needs: [quality, azure-infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dotreact-app:ci
          provenance: mode=max
          sbom: true
