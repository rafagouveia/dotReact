name: Performance benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotreact-performance-benchmark
  cancel-in-progress: false

jobs:
  fair-comparison:
    # Public claims require a quiet runner reserved for this suite. Ordinary hosted
    # PR runners remain useful for regression gates but are not publishable evidence.
    runs-on: [self-hosted, linux, x64, dotreact-benchmark]
    timeout-minutes: 45
    env:
      DOTREACT_BENCHMARK_DEDICATED: "true"
      DOTREACT_BENCHMARK_SAMPLE_RESOURCES: "true"
      DOTREACT_BENCHMARK_RENDERER_WORKERS: "1"
      DOTREACT_BENCHMARK_REQUESTS: "5000"
      DOTREACT_BENCHMARK_CONCURRENCY: "64"
      DOTREACT_BENCHMARK_WARMUP: "1000"
      DOTREACT_BENCHMARK_ROUNDS: "10"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install deterministically
        run: npm ci

      - name: Build production artifacts
        run: npm run build:tooling

      - name: Run comparable throughput and consumption suite
        run: npm run benchmark:consumption

      - name: Validate publishable snapshot
        run: node benchmarks/publish-results.mjs

      - name: Upload methodology and raw samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotreact-benchmark-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            benchmarks/results/latest.json
            benchmarks/published/latest.json
