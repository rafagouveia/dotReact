name: VS Code extension release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested VSIX to the Marketplace
        required: true
        default: false
        type: boolean
      channel:
        description: Marketplace release channel
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - stable
  push:
    tags:
      - vscode-v*

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test and package VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w dotreact-vscode
      - run: npm test -w dotreact-vscode
      - run: xvfb-run -a npm run test:integration -w dotreact-vscode
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#vscode-v}"
          actual="$(node -p "require('./editors/vscode-dotreact/package.json').version")"
          [[ "${expected}" == "${actual}" ]] || {
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${actual}." >&2
            exit 1
          }
      - name: Package tested extension
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" || "${{ inputs.channel }}" == "stable" ]]; then
            npm run package:vsix:stable -w dotreact-vscode
          else
            npm run package:vsix -w dotreact-vscode
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotreact-vscode
          path: editors/vscode-dotreact/dotreact-vscode.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Marketplace
    needs: package
    if: github.ref_type == 'tag' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.VSCE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotreact-vscode
          path: artifacts/vscode
      - name: Publish exact tested VSIX
        run: npx --no-install vsce publish --azure-credential --packagePath artifacts/vscode/dotreact-vscode.vsix
