name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - id: pages
        if: vars.DOTREACT_PUBLISH_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --prefix docs
      - name: Build static site
        env:
          DOTREACT_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm --prefix docs run build
      - name: Validate static artifact
        env:
          DOTREACT_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm --prefix docs run validate:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.DOTREACT_PUBLISH_PAGES == 'true'
        with:
          path: docs/dist

  deploy:
    name: Deploy documentation
    needs: build
    if: vars.DOTREACT_PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
