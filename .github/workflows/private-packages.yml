name: Private packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated archives to rafagouveia GitHub Packages
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: private-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@rafagouveia'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run verify
      - run: npm run packages:pack
      - name: Publish private npm packages
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run packages:publish:npm
      - name: Publish private NuGet packages
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run packages:publish:nuget
      - name: Verify published CLI from private packages
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke-published-cli.mjs
