name: Private packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated archives to rafagouveia GitHub Packages
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: private-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@rafagouveia'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run verify
      - run: npm run packages:pack
      - name: Publish private npm packages
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run packages:publish:npm
      - name: Publish private NuGet packages
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run packages:publish:nuget
